<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EDS HUB — Intelligent CRM & Deliverability Platform for Expert Dental Solutions" />
    <title>EDS HUB | Expert Dental Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body style="margin: 0; padding: 0; background-color: #08254f;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #08254f; font-family: 'Poppins', system-ui, -apple-system, sans-serif; color: #ffffff;">
        <div style="text-align: center; padding: 24px;">
          <div style="display: inline-block; padding: 12px 20px; border-radius: 16px; background-color: #ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 20px;">
            <div style="font-size: 18px; font-weight: 800; color: #08254f; letter-spacing: -0.5px;">EDS HUB</div>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #449bd5; font-size: 13px; font-weight: 600;">
            <svg style="animation: eds-spin 1s linear infinite; width: 20px; height: 20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            <span style="color: #e2e8f0;">Carregando plataforma...</span>
          </div>
        </div>
      </div>
      <style>
        @keyframes eds-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
